[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cua"
version = "0.1.0"
description = "Computer-use automation: LLM discovery -> typed capability artifact -> deterministic replay"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "google-genai>=1.0",
    "pydantic>=2.7",
    "flask>=3.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cua = "cua.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
